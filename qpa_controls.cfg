# Native Fluidd/Klipper macro controls for the QIDI Q2 PA database.

[gcode_macro QPA_SAFE_PREPARE]
description: Internal Stock-QIDI purge and safe centre position for manual PA
gcode:
    {% set hotend = params.HOTEND|int %}
    {% set purge = params.PURGE|default(1)|int %}
    {% if hotend < 160 or hotend > 350 %}
        {action_raise_error("QPA: HOTEND must be 160..350 C")}
    {% endif %}
    _CG28
    G90
    G1 Z80 F600
    {% if purge == 1 %}
        EXTRUSION_AND_FLUSH HOTEND={hotend}
    {% else %}
        M109 S{hotend}
    {% endif %}
    G90
    G1 Z80 F600
    {% set center_x = (printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2 %}
    {% set center_y = (printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2 %}
    G1 X{center_x} Y{center_y} F12000
    G1 Z80 F600

[gcode_macro QPA_RETURN_TO_BOX]
description: Internal Stock-QIDI return of a verified physical QIDI slot
gcode:
    {% if 'SLOT' not in params %}
        {action_raise_error("QPA_RETURN_TO_BOX requires SLOT")}
    {% endif %}
    # Same Stock-QIDI sequence as UNLOAD_FILAMENT, but with the verified
    # physical slot captured when the manual PA run began.
    CUT_FILAMENT T=0
    MOVE_TO_TRASH
    EXTRUDER_UNLOAD SLOT={params.SLOT}
    G1 E25 F300
    M104 S0
    CLEAR_OOZE
    CLEAR_FLUSH

[gcode_macro QPA_SAFE_CLEANUP]
description: Internal Stock-QIDI bucket park, optional verified return, print-end cleanup
gcode:
    M400
    {% if "xyz" in printer.toolhead.homed_axes %}
        MOVE_TO_TRASH
    {% endif %}
    {% if params.RETURN_SLOT|default('') %}
        QPA_RETURN_TO_BOX SLOT={params.RETURN_SLOT}
    {% endif %}
    PRINT_END

[gcode_macro FILAMENT_PA_AKTUELL]
description: Filament PA einstellen aktuellen Wert anzeigen
gcode:
    QPA_SHOW_CURRENT

[gcode_macro FILAMENT_PA_RUECKLAUF_STATUS]
description: PA Box-Ruecklauf pruefen (keine Bewegung)
gcode:
    QPA_RETURN_STATUS

[gcode_macro FILAMENT_PA_LISTE]
description: Filament PA einstellen Materialdatenbank anzeigen
gcode:
    QPA_LIST

[gcode_macro FILAMENT_PA_ANWENDEN]
description: Filament PA einstellen gespeicherten Materialwert anwenden
gcode:
    {% if 'MATERIAL' not in params %}
        {action_raise_error("QPA_UI_APPLY requires MATERIAL")}
    {% endif %}
    QPA_APPLY MATERIAL={params.MATERIAL}

[gcode_macro FILAMENT_PA_SETZEN]
description: Filament PA einstellen MATERIAL und PA manuell speichern anwenden
gcode:
    {% if 'MATERIAL' not in params or 'PA' not in params %}
        {action_raise_error("QPA_UI_SET requires MATERIAL and PA")}
    {% endif %}
    QPA_SET MATERIAL={params.MATERIAL} PA={params.PA}

[gcode_macro FILAMENT_PA_LOESCHEN]
description: Filament PA einstellen gespeicherten Materialwert loeschen
gcode:
    {% if 'MATERIAL' not in params %}
        {action_raise_error("QPA_UI_FORGET requires MATERIAL")}
    {% endif %}
    QPA_FORGET MATERIAL={params.MATERIAL}

[gcode_macro FILAMENT_PA_KALIBRIEREN]
description: PA kalibrieren - bereits geladenes Filament
gcode:
    # Defaults are intentional: Fluidd detects them as two separate UI fields.
    {% set material = params.MATERIAL|default("PLA")|string %}
    {% set hotend = params.HOTEND|default(220)|int %}
    {% if not material or hotend < 170 or hotend > 350 %}
        {action_raise_error("Bitte Material und eine Hotend-Temperatur von 170 bis 350 C angeben")}
    {% endif %}
    QPA_CALIBRATE MATERIAL={material} HOTEND={hotend} PURGE=1

[gcode_macro FILAMENT_PA_BOX_A_KALIBRIEREN]
description: Box A laden, PA kalibrieren, in Box A zuruecklegen
gcode:
    {% set material = params.MATERIAL|default("PLA")|string %}
    {% set hotend = params.HOTEND|default(220)|int %}
    {% if not material or hotend < 170 or hotend > 350 %}
        {action_raise_error("Bitte Material und eine Hotend-Temperatur von 170 bis 350 C angeben")}
    {% endif %}
    QPA_BOX_RECALIBRATE SLOT=slot0 MATERIAL={material} HOTEND={hotend} PURGE=1

